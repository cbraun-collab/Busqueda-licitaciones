<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorador de Licitaciones — SENERCOM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003B49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#003B49;
    --teal-light:#0a5568;
    --orange:#CF4520;
    --bg:#0b1620;
    --panel:#0f2530;
    --panel-2:#122b38;
    --border:#1d3c49;
    --text:#e7f1f4;
    --text-dim:#8fa8b3;
    --ok:#3ea86d;
    --warn:#CF4520;
    --info:#3d8bbd;
    font-family:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); min-height:100vh;}
  header{
    background:var(--teal); border-bottom:1px solid var(--border);
    padding:18px 28px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .brand img{height:46px; width:auto;}
  .brand .wordmark{font-size:19px; font-weight:700; letter-spacing:.01em; color:#fff; line-height:1;}
  .brand .wordmark span{color:var(--orange);}
  .brand .divisor{width:1px; height:34px; background:rgba(255,255,255,.18);}
  .brand .titulos{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; color:var(--orange); font-weight:500;}
  .brand h1{font-size:20px; font-weight:600;}
  .rango-fechas{display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap;}
  .rango-fechas label{font-size:11px; color:#bcd7de; font-family:'JetBrains Mono',monospace; display:block; margin-bottom:3px;}
  .rango-fechas input[type=date]{
    background:#06222b; border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:6px; font-family:'Space Grotesk',sans-serif; font-size:14px;
  }
  #btnBuscar{
    background:var(--orange); color:#fff; border:none; padding:12px 22px; border-radius:6px;
    font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px;
    transition:filter .15s;
  }
  #btnBuscar:hover{filter:brightness(1.1);}
  #btnBuscar:disabled{opacity:.55; cursor:default;}

  .layout{display:grid; grid-template-columns:340px 1fr; min-height:calc(100vh - 78px);}
  aside{
    background:var(--panel); border-right:1px solid var(--border); padding:22px;
    overflow-y:auto; max-height:calc(100vh - 78px);
  }
  .bloque{margin-bottom:26px;}
  .bloque h2{font-size:12px; letter-spacing:.06em; color:var(--text-dim); margin-bottom:12px; font-weight:600;}
  .estado-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .chk{
    display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border);
    padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .chk input{accent-color:var(--orange);}

  .kw-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .kw-actions{display:flex; gap:8px;}
  .kw-actions button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-size:11px; font-family:'JetBrains Mono',monospace; padding:4px 8px; border-radius:5px; cursor:pointer;
  }
  .kw-actions button:hover{color:var(--text); border-color:var(--teal-light);}
  .kw-categoria{font-size:11px; color:var(--orange); margin:14px 0 8px; display:flex; align-items:center; gap:6px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
    padding:7px 12px; border-radius:20px; font-size:12.5px; cursor:pointer; user-select:none;
    transition:all .12s;
  }
  .chip.on{background:rgba(207,69,32,.18); border-color:var(--orange); color:#ffb494;}
  .kw-add{display:flex; gap:6px; margin-top:14px;}
  .kw-add input{
    flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; border-radius:6px; font-size:13px;
  }
  .kw-add button{background:var(--teal-light); border:none; color:#fff; padding:0 14px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;}

  main{padding:26px 30px; overflow-y:auto;}
  .barra-resultados{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap;}
  .barra-resultados .conteo{font-size:14px; color:var(--text-dim);}
  .barra-resultados .conteo strong{color:var(--text);}
  .filtros-post{display:flex; gap:10px;}
  .filtros-post select{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:13px;
  }

  .aviso{
    background:rgba(207,69,32,.1); border:1px solid rgba(207,69,32,.4); border-radius:8px;
    padding:14px 16px; margin-bottom:18px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start;
  }
  .aviso b{color:#ffb494;}

  .estado-inicial{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:100px 20px; color:var(--text-dim); gap:10px;
  }
  .estado-inicial h2{color:var(--text); font-size:22px; font-weight:600;}
  .estado-inicial p{max-width:440px; line-height:1.5; font-size:14.5px;}
  .estado-inicial b{color:var(--orange);}

  .card{
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border);
    border-radius:8px; padding:18px 20px; margin-bottom:14px;
    display:grid; grid-template-columns:1fr 200px; gap:16px;
  }
  .card.adjudicada{border-left-color:var(--info);}
  .card.publicada{border-left-color:var(--ok);}
  .card.cerrada, .card.desierta{border-left-color:var(--text-dim);}

  .card-top{display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:4px 9px; border-radius:4px;
    text-transform:uppercase; letter-spacing:.04em; font-weight:500;
  }
  .badge.adjudicada{background:rgba(61,139,189,.18); color:#7fc4ea;}
  .badge.publicada{background:rgba(62,168,109,.18); color:#7fdba3;}
  .badge.cerrada,.badge.desierta{background:rgba(143,168,179,.15); color:var(--text-dim);}
  .badge-codigo{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}
  .badge-matches{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--orange);}

  .card-nombre{font-size:15px; line-height:1.4; margin-bottom:10px;}
  .card-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-dim);}
  .card-meta span{display:flex; align-items:center; gap:5px;}
  .kw-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .kw-tag{background:var(--panel-2); color:var(--text-dim); font-size:11px; padding:3px 8px; border-radius:10px;}

  .card-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px; justify-content:space-between;}
  .monto{text-align:right;}
  .monto .valor{font-size:16px; font-weight:600;}
  .monto .fuente{font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .monto .fuente.descripcion{color:#e0a94a;}
  .monto .fuente.no_disponible{color:var(--text-dim);}
  .cierre{font-size:12px; color:var(--text-dim); text-align:right;}
  .ver-btn{
    border:1px solid var(--teal-light); color:#9fd8e4; background:none; padding:8px 14px;
    border-radius:6px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .ver-btn:hover{background:var(--teal-light); color:#fff;}

  #accesoModal{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  #accesoModal .caja{background:var(--panel); border:1px solid var(--border); padding:28px; border-radius:10px; width:320px;}
  #accesoModal h3{margin-bottom:14px; font-size:16px;}
  #accesoModal input{width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:6px; margin-bottom:12px;}
  #accesoModal button{width:100%; background:var(--orange); color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    aside{max-height:none;}
    .card{grid-template-columns:1fr;}
    .card-right{flex-direction:row; align-items:center;}
  }
</style>
</head>
<body>

<div id="accesoModal">
  <div class="caja">
    <h3>Acceso — Explorador de Licitaciones</h3>
    <input type="password" id="claveInput" placeholder="Clave de acceso">
    <button id="btnEntrar">Entrar</button>
  </div>
</div>

<header>
  <div class="brand">
    <img src="logo-senercom.png" alt="Senercom" onerror="this.style.display='none'">
    <span class="wordmark">SENER<span>COM</span></span>
    <div class="divisor"></div>
    <div class="titulos">
      <span class="eyebrow">DASHBOARD OFICIAL</span>
      <h1>Explorador de Licitaciones</h1>
    </div>
  </div>
  <div class="rango-fechas">
    <div><label>Desde</label><input type="date" id="fechaDesde"></div>
    <div><label>Hasta</label><input type="date" id="fechaHasta"></div>
  </div>
  <button id="btnBuscar">🔍 Buscar</button>
</header>

<div class="layout">
  <aside>
    <div class="bloque">
      <h2>ESTADO</h2>
      <div class="estado-grid" id="estadoGrid"></div>
    </div>

    <div class="bloque">
      <div class="kw-header">
        <h2 style="margin:0;">PALABRAS CLAVE</h2>
        <div class="kw-actions">
          <button id="kwTodas">Todas</button>
          <button id="kwNinguna">Ninguna</button>
        </div>
      </div>
      <div id="kwContenedor"></div>
      <div class="kw-add">
        <input type="text" id="kwNueva" placeholder="Agregar palabra clave...">
        <button id="btnAgregarKw">+ Agregar</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="barra-resultados" id="barraResultados" style="display:none;">
      <div class="conteo" id="conteo"></div>
      <div class="filtros-post">
        <select id="filtroRegion"><option value="">Todas las regiones</option></select>
      </div>
    </div>
    <div id="avisoErrores"></div>
    <div id="resultados">
      <div class="estado-inicial">
        <h2>Dashboard SENERCOM listo</h2>
        <p>Configura el rango de fechas y haz clic en <b>Buscar</b> para consultar las licitaciones de Mercado Público en el período seleccionado.</p>
      </div>
    </div>
  </main>
</div>

<script>
// ============ CONFIGURACIÓN ============
// Reemplaza esto por la URL de tu implementación de Apps Script (Codigo.gs)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_Y1POuqbq1dIZTRAVtJ2lb_2a6CF9yQuk_fWeeSVIIqHwJIiRBhHvnmVR1-m6R8w/exec';

const CATEGORIAS_KEYWORDS = {
  'ELÉCTRICAS E INFRAESTRUCTURA': [
    'eléctrica','eléctrico','electricidad','generador','subestación','malla a tierra',
    'red de distribución','baja tensión','media tensión','mantenimiento eléctrico',
    'proyecto eléctrico','tablero eléctrico','iluminación','alumbrado',
    'sistema eléctrico','instalación eléctrica'
  ],
  'SEGURIDAD Y TELECOMUNICACIONES': [
    'CCTV','cámaras de seguridad','control de acceso','incendio','videovigilancia',
    'televigilancia','telefonía IP','puntos de cámaras','red de datos','red de voz',
    'sistema de seguridad','alarma'
  ]
};

const ESTADOS = [
  { valor:'publicada', label:'Publicada' },
  { valor:'vigente', label:'Vigente', alias:'publicada' },
  { valor:'cerrada', label:'Cerrada' },
  { valor:'desierta', label:'Desierta' },
  { valor:'adjudicada', label:'Adjudicada' },
  { valor:'revocada', label:'Revocada' },
  { valor:'suspendida', label:'Suspendida' }
];

let keywordsSeleccionadas = new Set();
let todasLasKeywords = [];
let ultimosResultados = [];

// ============ ACCESO ============
function claveGuardada(){ return localStorage.getItem('EL_CLAVE_APP'); }

document.getElementById('btnEntrar').addEventListener('click', function(){
  const v = document.getElementById('claveInput').value.trim();
  if(!v) return;
  localStorage.setItem('EL_CLAVE_APP', v);
  document.getElementById('accesoModal').style.display = 'none';
});

if (claveGuardada()) {
  document.getElementById('accesoModal').style.display = 'none';
}

// ============ INICIALIZACIÓN DE FILTROS ============
function initEstados(){
  const cont = document.getElementById('estadoGrid');
  ESTADOS.forEach(function(e){
    const label = document.createElement('label');
    label.className = 'chk';
    label.innerHTML = '<input type="checkbox" value="' + (e.alias || e.valor) + '" checked> ' + e.label;
    cont.appendChild(label);
  });
}

function initKeywords(){
  const cont = document.getElementById('kwContenedor');
  Object.keys(CATEGORIAS_KEYWORDS).forEach(function(cat){
    const titulo = document.createElement('div');
    titulo.className = 'kw-categoria';
    titulo.textContent = cat;
    cont.appendChild(titulo);

    const chips = document.createElement('div');
    chips.className = 'chips';
    CATEGORIAS_KEYWORDS[cat].forEach(function(kw){ chips.appendChild(crearChip(kw)); });
    cont.appendChild(chips);
  });
}

function crearChip(kw){
  todasLasKeywords.push(kw);
  keywordsSeleccionadas.add(kw);
  const chip = document.createElement('div');
  chip.className = 'chip on';
  chip.textContent = kw;
  chip.dataset.kw = kw;
  chip.addEventListener('click', function(){
    if (keywordsSeleccionadas.has(kw)) { keywordsSeleccionadas.delete(kw); chip.classList.remove('on'); }
    else { keywordsSeleccionadas.add(kw); chip.classList.add('on'); }
  });
  return chip;
}

document.getElementById('kwTodas').addEventListener('click', function(){
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.add('on'); keywordsSeleccionadas.add(c.dataset.kw); });
});
document.getElementById('kwNinguna').addEventListener('click', function(){
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  keywordsSeleccionadas.clear();
});
document.getElementById('btnAgregarKw').addEventListener('click', function(){
  const input = document.getElementById('kwNueva');
  const v = input.value.trim();
  if(!v) return;
  document.getElementById('kwContenedor').appendChild(crearChip(v));
  input.value = '';
});

initEstados();
initKeywords();

// Fechas por defecto: mes actual
(function fechasPorDefecto(){
  const hoy = new Date();
  const primero = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  document.getElementById('fechaDesde').valueAsDate = primero;
  document.getElementById('fechaHasta').valueAsDate = hoy;
})();

// ============ BÚSQUEDA ============
function ddmmaaaa(inputDateEl){
  const v = inputDateEl.value; // yyyy-mm-dd
  if(!v) return '';
  const [y,m,d] = v.split('-');
  return d + '-' + m + '-' + y;
}

function jsonp(url){
  return new Promise(function(resolve, reject){
    const cbName = 'cb_' + Date.now();
    window[cbName] = function(data){ resolve(data); delete window[cbName]; script.remove(); };
    const script = document.createElement('script');
    script.src = url + '&callback=' + cbName;
    script.onerror = function(){ reject(new Error('Error de red al consultar el backend')); };
    document.body.appendChild(script);
  });
}

document.getElementById('btnBuscar').addEventListener('click', buscar);

async function buscar(){
  if (APPS_SCRIPT_URL.indexOf('PEGA_AQUI') !== -1) {
    alert('Falta configurar APPS_SCRIPT_URL con la URL de tu Web App de Apps Script.');
    return;
  }

  const btn = document.getElementById('btnBuscar');
  btn.disabled = true;
  btn.textContent = 'Buscando…';
  document.getElementById('resultados').innerHTML = '<div class="estado-inicial"><p>Consultando Mercado Público…</p></div>';
  document.getElementById('barraResultados').style.display = 'none';
  document.getElementById('avisoErrores').innerHTML = '';

  const estados = Array.from(document.querySelectorAll('#estadoGrid input:checked')).map(function(i){ return i.value; });
  const params = new URLSearchParams({
    claveApp: claveGuardada() || '',
    fechaDesde: ddmmaaaa(document.getElementById('fechaDesde')),
    fechaHasta: ddmmaaaa(document.getElementById('fechaHasta')),
    estados: estados.join(','),
    keywords: Array.from(keywordsSeleccionadas).join(',')
  });

  try {
    const data = await jsonp(APPS_SCRIPT_URL + '?' + params.toString());
    if (!data.ok) throw new Error(data.error || 'Error desconocido');
    ultimosResultados = data.resultados;
    mostrarResultados(data);
  } catch (err) {
    document.getElementById('resultados').innerHTML =
      '<div class="estado-inicial"><h2>No se pudo completar la búsqueda</h2><p>' + err.message + '</p></div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Buscar';
  }
}

function mostrarResultados(data){
  document.getElementById('barraResultados').style.display = 'flex';
  document.getElementById('conteo').innerHTML = '<strong>' + data.total + '</strong> licitaciones encontradas';

  if (data.erroresDias && data.erroresDias.length){
    document.getElementById('avisoErrores').innerHTML =
      '<div class="aviso">⚠️ <span><b>Advertencia:</b> algunos días no pudieron consultarse (' +
      data.erroresDias.length + ' error(es)). Los resultados pueden ser parciales.</span></div>';
  }
  if (data.truncado){
    document.getElementById('avisoErrores').innerHTML +=
      '<div class="aviso">⚠️ <span><b>Búsqueda muy amplia:</b> se encontraron más de 300 licitaciones que calzan con tus filtros ' +
      'y se muestran solo las 300 con cierre más próximo. Reduce el rango de fechas o selecciona menos palabras clave / estados para ver el resto.</span></div>';
  }

  poblarFiltroRegion(data.resultados);
  renderizarCards(data.resultados);
}

function poblarFiltroRegion(resultados){
  const select = document.getElementById('filtroRegion');
  select.innerHTML = '<option value="">Todas las regiones</option>';
  const regiones = Array.from(new Set(resultados.map(function(r){ return r.region; }).filter(Boolean))).sort();
  regiones.forEach(function(r){
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    select.appendChild(opt);
  });
  select.onchange = function(){
    const filtrados = select.value ? ultimosResultados.filter(function(r){ return r.region === select.value; }) : ultimosResultados;
    renderizarCards(filtrados);
    document.getElementById('conteo').innerHTML = '<strong>' + filtrados.length + '</strong> licitaciones encontradas';
  };
}

function formatoMonto(m){
  if (!m || m.fuente === 'no_disponible' || m.valor == null) {
    return '<div class="monto"><div class="fuente no_disponible">Monto no publicado</div></div>';
  }
  const monedaLabel = { CLP:'$', CLF:'UF', UTM:'UTM', CLP_MILES:'M$' }[m.moneda] || m.moneda;
  const valorFmt = Number(m.valor).toLocaleString('es-CL');
  const fuenteLabel = m.fuente === 'descripcion' ? 'estimado desde descripción' : 'publicado';
  return '<div class="monto"><div class="valor">' + monedaLabel + ' ' + valorFmt + '</div>' +
    '<div class="fuente ' + m.fuente + '">' + fuenteLabel + '</div></div>';
}

function renderizarCards(lista){
  const cont = document.getElementById('resultados');
  if (!lista.length){
    cont.innerHTML = '<div class="estado-inicial"><h2>Sin resultados</h2><p>Ninguna licitación coincide con los filtros seleccionados.</p></div>';
    return;
  }
  cont.innerHTML = lista.map(function(r){
    const estadoClase = (r.estado || '').toLowerCase();
    const kwTags = (r.matches || []).map(function(k){ return '<span class="kw-tag">' + k + '</span>'; }).join('');
    return '<div class="card ' + estadoClase + '">' +
      '<div>' +
        '<div class="card-top">' +
          '<span class="badge ' + estadoClase + '">' + r.estado + '</span>' +
          '<span class="badge-codigo">' + r.codigo + '</span>' +
          (r.matchCount ? '<span class="badge-matches">⚡ ' + r.matchCount + ' matches</span>' : '') +
        '</div>' +
        '<div class="card-nombre">' + r.nombre + '</div>' +
        '<div class="card-meta">' +
          '<span>🏛 ' + (r.organismo || 'Organismo no especificado') + '</span>' +
          (r.region ? '<span>📍 ' + r.region + (r.comuna ? ' · ' + r.comuna : '') + '</span>' : '') +
        '</div>' +
        (kwTags ? '<div class="kw-tags">' + kwTags + '</div>' : '') +
      '</div>' +
      '<div class="card-right">' +
        formatoMonto(r.monto) +
        '<div class="cierre">⏱ Cierre: ' + (r.fechaCierre ? r.fechaCierre.split('T')[0] : '—') + '</div>' +
        '<button class="ver-btn" onclick="window.open(\'' + r.urlLicitacion + '\',\'_blank\')">Ver licitación →</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
